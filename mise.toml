# Required for `extends = "<ns>:_base"` task inheritance (still flagged
# experimental in mise; behaviour is stable, used by joeblew999/.github v0.18+).
[settings]
experimental = true

[task_config]
# Browseable URLs for the shared lib (drop `git::`, drop `.git`,
# swap `?ref=v…` for `/blob/v…/`):
#   https://github.com/joeblew999/.github/blob/v0.19.2/tasks/ci.toml
#   https://github.com/joeblew999/.github/blob/v0.19.2/tasks/cf.toml
#   https://github.com/joeblew999/.github/blob/v0.19.2/tasks/secrets.toml
includes = [
  "tasks/check.toml",
  "tasks/test.toml",
  "tasks/build.toml",
  "tasks/prove.toml",
  "tasks/system.toml",
  "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=v0.19.2",
  "git::https://github.com/joeblew999/.github.git//tasks/cf.toml?ref=v0.19.2",
  "git::https://github.com/joeblew999/.github.git//tasks/secrets.toml?ref=v0.19.2",
]

[tools]
# Language toolchains.
node = "26"
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
# `zig cc` cross-compiles C → wasm32 for ripgit's zstd-sys (Apple clang has no
# wasm target). Wired up via .mise-bin/zig-cc + the env vars below.
zig = "0.16"

# Task runtime + secrets.
"github:nushell/nushell" = "0.112"
"github:jdx/fnox"        = "1.24"

# Long-lived daemon orchestrator (dev-stack, device daemon).
"github:endevco/pitchfork" = "2.10.0"

# Build helpers.
"github:endevco/aube"    = "1.9.1"   # npm-compatible package manager
"github:mozilla/sccache" = "0.15.0"  # cargo compiler cache; see RUSTC_WRAPPER below
# worker-build is required by `mise run 3-build-rust` but NOT pinned here:
# `cargo:worker-build` installs from crates.io, which trips on the
# RUSTC_WRAPPER=sccache env (sccache wraps rustc during the install itself
# and chokes on the rustup toolchain path). Install once manually:
#   cargo install -f worker-build
# CI workaround: cf:* and check don't invoke 3-build-rust, so green CI
# without worker-build is fine. Local users running system-local need it.

[env]
CARGO_TERM_COLOR = "always"
RUSTC_WRAPPER    = "sccache"

# Add project-local shims to PATH (zig-cc target translator + macOS flock no-op).
_.path = [".mise-bin"]

# Force the wasm32 cc to be `zig cc` instead of Apple clang (which has no wasm target).
# RIPGIT_WASM_CC is consumed by ripgit/scripts/wasm-cc; CC_wasm32_unknown_unknown
# is read by cargo's `cc` crate (zstd-sys' build.rs).
RIPGIT_WASM_CC            = "{{config_root}}/.mise-bin/zig-cc"
CC_wasm32_unknown_unknown = "{{config_root}}/.mise-bin/zig-cc"

# Which fnox keys `mise run secrets:sync-github` pushes to GH Actions secrets.
FNOX_SYNC_KEYS = "CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID,CF_API_TOKEN,CF_ACCOUNT_ID"
