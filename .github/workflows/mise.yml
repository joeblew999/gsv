name: Mise

on:
  push:
    branches: [main, joeblew999]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-check:
    name: Parse-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: true
          cache: true

      - name: Show toolchain + tasks
        run: |
          mise ls
          mise tasks ls

      - name: Parse-check every nu task file
        run: mise run ci-parse-check

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: parse-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: true
          cache: true

      - name: Run mise CI bundle (version-check + build-cli + test-cli)
        run: mise run ci
