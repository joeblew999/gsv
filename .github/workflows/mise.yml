name: Mise

on:
  push:
    branches: [joeblew999]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SSOT: each job runs ONE mise task. The task's own `#MISE depends=[...]`
# header fans out the work. To change what CI does, edit the task — never
# enumerate steps here.

jobs:
  parse-check:
    name: Parse-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: true
          cache: true
          # Workaround for jdx/mise-action#382 — default cache key has
          # prefix-match collisions + missing return-on-hit. Custom key
          # keyed on (job, os, mise.toml hash) dodges both bugs.
          cache_key: mise-${{ github.job }}-${{ matrix.os }}-${{ hashFiles('mise.toml') }}
      - run: mise run ci-parse-check

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: parse-check
    strategy:
      fail-fast: false
      # Windows skipped — slow + parse-check already covers it.
      # Add back if a windows-only regression surfaces.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: true
          cache: true
          # Workaround for jdx/mise-action#382 — default cache key has
          # prefix-match collisions + missing return-on-hit. Custom key
          # keyed on (job, os, mise.toml hash) dodges both bugs.
          cache_key: mise-${{ github.job }}-${{ matrix.os }}-${{ hashFiles('mise.toml') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: sccache-${{ matrix.os }}-
      - run: mise run ci
