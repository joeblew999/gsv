name: Mise

on:
  push:
    branches: [joeblew999]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-check:
    name: Parse-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: true
          cache: true
      - name: Parse-check nu task files
        run: mise run ci-parse-check

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: parse-check
    strategy:
      fail-fast: false
      # Skipping windows-latest — its parse-check already passed; windows
      # cargo+vitest is 2-3× slower than linux/macos for marginal coverage.
      # Add it back if a windows-only regression surfaces.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: true
          cache: true

      # sccache cache directory — same path locally and in CI; mise wires
      # RUSTC_WRAPPER=sccache so cargo invokes it automatically.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: sccache-${{ matrix.os }}-

      # Cut from the previous shape:
      # - 4-build-cli removed: `cargo test` (test-cli) already compiles cli/.
      # - test-ripgit removed: upstream's ci.yml runs `cargo test` in ripgit
      #   on main pushes; no need to mirror.
      - name: 1-deps (aube install)
        run: mise run 1-deps
      - name: test-cli (cargo test cli)
        run: mise run test-cli
      - name: test-gateway (tsc + vitest)
        run: mise run test-gateway
