name: Mise

on:
  push:
    branches: [joeblew999]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-check:
    name: Parse-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # install: false → don't pull the full mise.toml [tools] set; we only
      # need nushell for parse-checking the task files.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: false
          cache: true
      - run: mise install github:nushell/nushell
      - run: mise run ci-parse-check

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: parse-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # validate needs node (version-check), rust (build-cli, test-cli),
      # nushell (driver), and sccache (cache rustc). Skip aube/zig/pitchfork/
      # fnox/gh/jq — none of those are exercised by `mise run ci`.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: false
          cache: true
      - run: mise install github:nushell/nushell node rust github:mozilla/sccache

      # sccache cache directory — same path locally and in CI; mise wires
      # RUSTC_WRAPPER=sccache so cargo invokes it automatically.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: sccache-${{ matrix.os }}-

      - run: mise run ci
