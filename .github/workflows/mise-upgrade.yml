name: Mise upgrade

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade pinned tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          version: 2026.5.1
          install: false

      - name: mise run mise-upgrade
        run: mise run mise-upgrade

      - name: Open PR if mise.toml changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(mise): bump pinned tool versions"
          branch: mise-upgrade
          delete-branch: true
          title: "chore(mise): bump pinned tool versions"
          body: |
            Automated weekly bump produced by `mise run mise-upgrade`.

            Workflow: `.github/workflows/mise-upgrade.yml`
            Task source: `mise-tasks/mise-upgrade`

            Diff is whatever `mise upgrade --bump` produced for `mise.toml`.
            Run the same thing locally: `mise run mise-upgrade --dry-run`.
          add-paths: mise.toml
          labels: dependencies, automated
