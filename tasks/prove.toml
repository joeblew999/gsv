# tasks/prove.toml — gsv-specific probes (NOT to be confused with the
# shared lib's prove:* namespace, which targets CF Access deployments).
# These verify gsv stack health: local gateway, cloud gateway, device
# daemon, end-to-end chat round-trip.

# ── prove:_base ──
# Note: gsv's prove-* tasks are NOT the same as joeblew999/.github's
# prove:* namespace (which probes CF Access deployments). gsv doesn't
# include that shared file — these are gsv-stack-specific probes.
["prove:_base"]
hide = true
tools = { "github:nushell/nushell" = "0.112" }

# ── prove-all ──
["prove-all"]
extends = "prove:_base"
description = "Run every probe (CF token, local stack, cloud gateway, device daemon)"
depends = ["cf:token-check", "prove-local", "prove-cloud", "prove-device"]
run = '''
#!/usr/bin/env nu

def main [] {
  print "✓ all probes passed"
}
'''

# ── prove-local ──
["prove-local"]
extends = "prove:_base"
description = "Probe the local dev stack — expect 200 from http://localhost:8787"
run = '''
#!/usr/bin/env nu

def main [] {
  let result = (try { ^curl --max-time 5 -fsS -o /dev/null http://localhost:8787/; true } catch { false })
  if $result {
    print "✓ local gateway responding on http://localhost:8787"
  } else {
    print --stderr "✗ local gateway not responding on http://localhost:8787"
    exit 1
  }
}
'''

# ── prove-cloud ──
["prove-cloud"]
extends = "prove:_base"
description = "Probe the deployed CF gateway — reads URL from local gsv config"
run = '''
#!/usr/bin/env nu

def main [] {
  let gsv = $"($env.MISE_PROJECT_ROOT)/cli/target/release/gsv"
  let ws_url = (try { ^$gsv config --local get gateway.url | str trim } catch { "" })
  if ($ws_url | is-empty) {
    print --stderr "✗ gateway.url not set in local config — run gsv config --local set gateway.url ws://..."
    exit 1
  }
  let http_url = ($ws_url | str replace --regex '^ws' 'http' | str replace --regex '/ws$' '')
  let ok = (try { ^curl --max-time 10 -fsS -o /dev/null $"($http_url)/"; true } catch { false })
  if $ok {
    print $"✓ cloud gateway responding at ($http_url)"
  } else {
    print --stderr $"✗ cloud gateway not responding at ($http_url)"
    exit 1
  }
}
'''

# ── prove-chat ──
["prove-chat"]
extends = "prove:_base"
description = "End-to-end smoke: send a one-shot chat to the configured agent, expect a non-empty reply"
run = '''
#!/usr/bin/env nu

def main [] {
  let gsv = $"($env.MISE_PROJECT_ROOT)/cli/target/release/gsv"
  let result = (do { ^$gsv chat "Reply with one word: ok" } | complete)
  let body = ($result.stdout | default "")
  print $body
  let lines = ($body | lines | where { |l| ($l | str trim | is-not-empty) and not ($l | str starts-with "Connecting") })
  if ($lines | length) > 0 and $result.exit_code == 0 {
    print "✓ chat round-trip working"
  } else {
    print --stderr "✗ chat round-trip failed"
    exit 1
  }
}
'''

# ── prove-device ──
["prove-device"]
extends = "prove:_base"
description = "Prove the device daemon is connected — reads ~/.gsv/logs/node.log; works for pitchfork or launchd"
run = '''
#!/usr/bin/env nu

def main [] {
  let log_path = $"($env.HOME)/.gsv/logs/node.log"
  if not ($log_path | path exists) {
    print --stderr $"✗ no node log at ($log_path) — daemon never started?"
    exit 1
  }

  # The daemon emits multiple connect.ok events at the same ts (one with `implements`,
  # one with `keepaliveSeconds`). Merge all the latest-batch events into one record so
  # downstream field extraction picks up everything regardless of order.
  let all_connects = (
    open --raw $log_path
    | lines
    | where { |l| ($l | str contains 'connect.ok') }
    | each { |l| try { $l | from json } catch { null } }
    | where { |r| $r != null }
  )

  if ($all_connects | length) == 0 {
    print --stderr "✗ no connect.ok event in node.log — daemon hasn't connected yet"
    exit 1
  }

  let latest_ts = ($all_connects | last | get ts)
  let parsed = (
    $all_connects
    | where { |r| ($r.ts? | default "") == $latest_ts }
    | reduce {|it, acc| $acc | merge $it }
  )

  # Also check that no connect.fail / disconnect appeared after this connect.ok
  let later = (
    open --raw $log_path
    | lines
    | where { |l| ($l | str contains 'disconnect') or ($l | str contains 'connect.fail') }
    | where { |l|
        let evt = (try { $l | from json } catch { {ts: ""} })
        ($evt.ts? | default "") > ($parsed.ts? | default "")
      }
  )

  if ($later | length) > 0 {
    print --stderr $"✗ device disconnected after connect.ok at ($parsed.ts)"
    print --stderr ($later | last)
    exit 1
  }

  # url is on node.start, not connect.ok — pull from the most recent node.start event
  let url = (
    open --raw $log_path
    | lines
    | where { |l| ($l | str contains '"event":"node.start"') }
    | last
    | (try { from json | get url } catch { "?" })
  )
  let node_id = ($parsed.nodeId? | default "?")
  let workspace = ($parsed.workspace? | default "?")
  let impls = ($parsed.implements? | default [])
  print $"✓ device ($node_id) connected to ($url)"
  print $"  workspace: ($workspace)"
  print $"  implements: ($impls | str join ', ')"
}
'''
